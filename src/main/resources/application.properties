spring.application.name=biblioteca

# Default in-memory for local/dev; docker-compose overrides via env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:biblioteca}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA settings
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# Reglas de negocio del dominio
# Días de plazo para devolver un ejemplar
prestamo.dias-plazo=14
# Tarea programada que marca préstamos vencidos (cron Spring: cada minuto por defecto)
prestamo.cron-vencidos=0 * * * * ?
